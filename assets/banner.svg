<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark gradient background -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent gradient for text & borders -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Drop shadow for main card -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    
    /* Dynamic background animations */
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .pulse-delay-1 {
      animation: pulse 3.5s ease-in-out 0.8s infinite alternate;
    }
    .pulse-delay-2 {
      animation: pulse 4s ease-in-out 1.5s infinite alternate;
    }
    .data-stream {
      stroke-dasharray: 12, 12;
      animation: dash 20s linear infinite;
    }

    @keyframes pulse {
      0% { r: 4px; opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { r: 10px; opacity: 0.4; }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -240;
      }
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGlow)"/>
  <rect x="2" y="2" width="1196" height="316" rx="14" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Background Animated Data Grid & Network Nodes (strictly in background) -->
  <g opacity="0.25">
    <line x1="100" y1="60" x2="1100" y2="60" stroke="#334155" stroke-width="1"/>
    <line x1="100" y1="160" x2="1100" y2="160" stroke="#334155" stroke-width="1"/>
    <line x1="100" y1="260" x2="1100" y2="260" stroke="#334155" stroke-width="1"/>
    
    <!-- Animated Flow Lines -->
    <path d="M 100 260 Q 350 60 600 160 T 1100 60" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="data-stream" opacity="0.6"/>
    <path d="M 100 60 Q 400 260 700 160 T 1100 260" fill="none" stroke="#38bdf8" stroke-width="1.5" class="data-stream" opacity="0.4"/>
  </g>

  <!-- Background Pulsing Edge Nodes -->
  <g>
    <circle cx="200" cy="80" r="6" fill="#38bdf8" class="pulse-circle"/>
    <circle cx="950" cy="240" r="8" fill="#818cf8" class="pulse-delay-1"/>
    <circle cx="1050" cy="100" r="5" fill="#c084fc" class="pulse-delay-2"/>
    <circle cx="150" cy="220" r="7" fill="#06b6d4" class="pulse-delay-1"/>
  </g>

  <!-- Foreground Content Card (Ensures 100% Text Visibility) -->
  <g transform="translate(60, 45)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="110" y="18" text-anchor="middle" class="badge-text">⚡ EDGE &amp; DATA ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title">
      Awesome Ultra-Portable Edge Computing
    </text>
    <text x="0" y="122" class="title" fill="url(#accentGrad)">
      &amp; Disconnected Data Transfer
    </text>

    <!-- Subtitle -->
    <text x="0" y="168" class="subtitle">
      A curated list of rugged edge appliances, offline data migration platforms &amp; open-source edge computing frameworks.
    </text>

    <!-- Metric Tags -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="80" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📦 SaaS &amp; Hardware</text>

      <rect x="175" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="255" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 Open-Source</text>

      <rect x="350" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="430" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔒 Offline-First</text>
    </g>
  </g>
</svg>
