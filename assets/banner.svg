<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="nodeGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".6" stdDeviation="15"/></filter></defs><style>@keyframes pulse{0%{r:4px;opacity:.3}50%{opacity:.9}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-size:34px;font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle{font-size:16px;font-weight:500;fill:#94a3b8}.badge-text{font-size:12px;font-weight:700;fill:#38bdf8;letter-spacing:1px}.pulse-circle{animation:pulse 3s ease-in-out infinite alternate}.pulse-delay-1{animation:pulse 3.5s ease-in-out .8s infinite alternate}.pulse-delay-2{animation:pulse 4s ease-in-out 1.5s infinite alternate}.data-stream{stroke-dasharray:12,12;animation:dash 20s linear infinite}</style><rect width="1200" height="320" fill="url(#bgGlow)" rx="16"/><rect width="1196" height="316" x="2" y="2" fill="none" stroke="url(#accentGrad)" stroke-opacity=".3" stroke-width="2" rx="14"/><g opacity=".25"><line x1="100" x2="1100" y1="60" y2="60" stroke="#334155" stroke-width="1"/><line x1="100" x2="1100" y1="160" y2="160" stroke="#334155" stroke-width="1"/><line x1="100" x2="1100" y1="260" y2="260" stroke="#334155" stroke-width="1"/><path fill="none"